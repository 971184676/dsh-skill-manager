name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The pure skill-domain logic (lib/skill-model.js, lib/yaml.js) is
      # dependency-free by design, so the whole suite runs with zero install.
      - name: Run unit tests
        run: npm test

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Guard the two mistakes that have actually shipped and broken users:
      #   1. a malformed package.json, and
      #   2. a client half that injects a service whose package is missing from
      #      dsh.client.inject — which leaves the whole client plugin pending and
      #      hides the sidebar entry with no error at all.
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
      - name: Check client inject covers every injected service
        run: node tools/check-inject.mjs

  client-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every source file
        run: |
          for f in index.js client.js remote.js lib/*.js tools/*.mjs; do
            node --check "$f"
          done
          echo "syntax OK"